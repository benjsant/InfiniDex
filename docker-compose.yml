services:
  db:
    image: postgres:16
    container_name: fusiondex_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fusiondex_db}
      POSTGRES_USER: ${POSTGRES_USER:-fusiondex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fusiondex_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql
    ports:
      - "${FUSIONDEX_DB_PORT:-55432}:5432"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fusiondex_user} -d ${POSTGRES_DB:-fusiondex_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  etl:
    build:
      context: .
      dockerfile: docker/Dockerfile.etl
    container_name: fusiondex_etl
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fusiondex_db}
      POSTGRES_USER: ${POSTGRES_USER:-fusiondex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fusiondex_password}
      # Required by the Prefect watcher flows to post to Discord (no fallback
      # — if absent, watchers log "DISCORD_WEBHOOK_URL not set" and skip).
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./etl:/app/etl
      - ./data:/app/data
      - ./docker:/app/docker:ro
    networks:
      - backend
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: fusiondex_backend
    depends_on:
      db:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fusiondex_db}
      POSTGRES_USER: ${POSTGRES_USER:-fusiondex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fusiondex_password}
      SPRITES_DIR: /app/data/sprites
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:53000,http://localhost:58000}
      # AI providers (au moins un doit être actif sinon /ai/ask renvoie 503).
      # Lus à runtime via env_file (.env). Ils sont listés explicitement
      # ici pour les rendre découvrables.
      DEEPSEEK_API_KEY:    ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY:  ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL:    ${OPENROUTER_MODEL:-}
      OLLAMA_URL:          ${OLLAMA_URL:-}
      OLLAMA_MODEL:        ${OLLAMA_MODEL:-qwen2.5:3b}
      # Clé interne Next.js↔Backend. Vide = pas d'enforcement (dev sans clé).
      # Générer avec : openssl rand -hex 32
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    volumes:
      - ./backend:/app/backend
      - ./data/sprites:/app/data/sprites:ro
      - ${SPECIAL_SPRITES_PATH:-./data/special_sprites}:/app/data/special_sprites:ro
    ports:
      - "${FUSIONDEX_BACKEND_PORT:-58000}:8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  sprites:
    image: nginx:1.27-alpine
    container_name: fusiondex_sprites
    volumes:
      - ./data/sprites:/usr/share/nginx/html/sprites:ro
    ports:
      - "${FUSIONDEX_SPRITES_PORT:-58080}:80"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      etl:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: fusiondex_frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Proxy Next.js → backend / sprites via le réseau Docker interne.
      # Le browser n'a jamais connaissance de ces URLs.
      BACKEND_INTERNAL_URL: http://backend:8000
      SPRITES_INTERNAL_URL: http://sprites:80
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      - "${FUSIONDEX_FRONTEND_PORT:-53000}:3000"
    networks:
      - backend
    restart: unless-stopped

  # Service optionnel : run de la suite pytest complète contre la DB de dev.
  # Usage :
  #   docker compose --profile test run --rm test-backend
  #   docker compose --profile test run --rm test-backend pytest tests/test_fusion.py -v
  test-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: test
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fusiondex_db}
      POSTGRES_USER: ${POSTGRES_USER:-fusiondex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fusiondex_password}
      SPRITES_DIR: tests/fixtures/sprites
      FUSIONDEX_TEST_DOCKER: "1"
    volumes:
      - ./backend:/app/backend
    networks:
      - backend
    working_dir: /app/backend
    entrypoint: ["uv", "run", "pytest"]
    command: ["-v", "--tb=short"]

  # Service optionnel : tests E2E Playwright contre le frontend en cours.
  # Usage :
  #   docker compose --profile e2e run --rm e2e
  #   docker compose --profile e2e run --rm e2e --grep "fusion detail"
  e2e:
    build:
      context: .
      dockerfile: docker/Dockerfile.e2e
    profiles: ["e2e"]
    depends_on:
      frontend:
        condition: service_started
    environment:
      BASE_URL: http://frontend:3000
    volumes:
      - ./e2e/tests:/app/tests:ro
      - ./e2e/playwright.config.ts:/app/playwright.config.ts:ro
    networks:
      - backend

  # ── Prefect self-hosted (profil "prefect") ──────────────────────────────────
  # Démarre le serveur Prefect + un worker process pour les flows ETL.
  #
  # Premier démarrage :
  #   docker compose --profile prefect up -d
  #   docker compose --profile prefect exec prefect-worker \
  #     prefect work-pool create fusiondex-pool --type process --skip-if-exists
  #   docker compose --profile prefect exec prefect-worker \
  #     prefect --no-prompt deploy --all
  #
  # UI : http://localhost:54200
  # Déclencher un flow manuellement :
  #   docker compose --profile prefect exec prefect-worker \
  #     prefect deployment run 'fusiondex-etl-pipeline/etl-pipeline-manual'

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: fusiondex_prefect_server
    profiles: ["prefect"]
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_UI_URL: http://localhost:54200
      PREFECT_API_URL: http://localhost:54200/api
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_HOME: /prefect
    volumes:
      - prefect_data:/prefect
    ports:
      - "${FUSIONDEX_PREFECT_PORT:-54200}:4200"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  prefect-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.etl
    container_name: fusiondex_prefect_worker
    profiles: ["prefect"]
    command: prefect worker start --pool fusiondex-pool --type process
    depends_on:
      prefect-server:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_HOME: /prefect
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fusiondex_db}
      POSTGRES_USER: ${POSTGRES_USER:-fusiondex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fusiondex_password}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./etl:/app/etl
      - ./data:/app/data
      - ./docker:/app/docker:ro
      # Needed by `prefect deploy --all` to find the deployment definitions.
      - ./prefect.yaml:/app/prefect.yaml:ro
      - prefect_data:/prefect
    networks:
      - backend
    restart: unless-stopped

  # Service optionnel : LLM local Ollama pour fallback IA sans clé DeepSeek.
  # Démarre uniquement sur demande :
  #   docker compose --profile ollama up -d ollama
  # Le backend détecte sa présence via la variable OLLAMA_URL dans .env.
  # Au premier démarrage, le modèle (qwen2.5:3b ~2 GB) est téléchargé via
  # `ollama pull` lancé en parallèle de `ollama serve`.
  ollama:
    image: ollama/ollama:latest
    container_name: fusiondex_ollama
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${FUSIONDEX_OLLAMA_PORT:-58200}:11434"
    networks:
      - backend
    restart: unless-stopped
    # Garde-fou mémoire — qwen2.5:3b nécessite ~3 GB (2 GB poids + runtime).
    # Sans limite explicite, Docker sur Windows/WSL2 peut laisser le container
    # mourir silencieusement par OOM sans message d'erreur visible.
    # Avec mem_limit, Docker signale proprement "Killed" au lieu d'un timeout.
    # ⚠ Windows / WSL2 : si Docker Desktop plafonne WSL2 à 2 GB (défaut sur
    #   certaines configs), ajouter dans %UserProfile%\.wslconfig :
    #     [wsl2]
    #     memory=6GB
    #   puis relancer : wsl --shutdown && redémarrer Docker Desktop.
    mem_limit: "4g"
    memswap_limit: "4g"   # désactive le swap (évite thrashing disque si OOM)
    # Pull le modèle par défaut au boot. `ollama serve` démarre en
    # background ; le `pull` attend que le serveur soit prêt puis tire
    # le modèle ; enfin `wait` reprend le PID du serveur.
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        SERVE_PID=$$!
        sleep 3
        ollama pull "${OLLAMA_MODEL:-qwen2.5:3b}" || true
        wait $$SERVE_PID

  # Service optionnel : documentation MkDocs Material avec hot-reload.
  # Démarre uniquement sur demande :
  #   docker compose --profile docs up docs
  # N'entre pas dans `docker compose up` par défaut (pas nécessaire au run
  # de l'app) ni dans l'override prod.
  screenshots:
    build:
      context: .
      dockerfile: docker/Dockerfile.screenshots
    container_name: fusiondex_screenshots
    profiles: ["screenshots"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FUSIONDEX_URL: "http://host.docker.internal:${FUSIONDEX_FRONTEND_PORT:-53000}"
    volumes:
      - ./screenshots:/app/screenshots
      - ./scripts/screenshots.mjs:/app/scripts/screenshots.mjs:ro
    command: node scripts/screenshots.mjs
    networks:
      - backend

  docs:
    build:
      context: .
      dockerfile: docker/Dockerfile.docs
    container_name: fusiondex_docs
    profiles: ["docs"]
    volumes:
      # Montage live pour le hot-reload. Le .venv reste dans l'image.
      - ./docs:/app/docs
      - ./mkdocs.yml:/app/mkdocs.yml
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      # Source Python pour l'auto-doc (mkdocstrings en mode static via griffe).
      - ./backend:/app/backend:ro
    ports:
      - "${FUSIONDEX_DOCS_PORT:-58100}:58100"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  prefect_data:

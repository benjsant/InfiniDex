<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>InfiniDex variant B — pure lemniscate ∞</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#090c1a"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="50%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="cross" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#e0e7ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Lemniscate (figure-eight) drawn as a cubic Bezier path,
       stroked with the indigo→violet gradient. Two loops meet at the center. -->
  <path d="M 256 256
           C 256 144, 80  144, 80  256
           S 256 368, 256 256
           S 432 144, 432 256
           S 256 368, 256 256 Z"
        fill="none" stroke="url(#stroke)" stroke-width="56"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bright crossing point: where the two loops fuse -->
  <circle cx="256" cy="256" r="70" fill="url(#cross)"/>
</svg>

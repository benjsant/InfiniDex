[project]
name = "infinidex-etl"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.1.6",
    "scrapy>=2.19.0",
    "lxml>=6.1.3",
    "pillow>=12.3.0",
    "prefect>=3.9.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl"]

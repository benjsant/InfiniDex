# Production override — appliquer par-dessus docker-compose.yml :
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.prod up -d
#
# Architecture résultante :
#
#   Internet → reverse proxy (Caddy / Nginx, TLS sur l'hôte)
#                  ↓ port 3000
#              frontend (Next.js)
#                  ↓ réseau Docker interne seulement
#              backend :8000  |  sprites :80  |  db :5432
#
# Aucun port backend/db/sprites n'est publié sur l'hôte.
# Le browser ne voit jamais ces adresses internes.
#
# Fichier .env.prod minimum requis :
#   POSTGRES_PASSWORD=<mot de passe fort>
#   CORS_ALLOWED_ORIGINS=https://fusiondex.ton-domaine.com
#   DEEPSEEK_API_KEY=sk-...   (ou OLLAMA_URL)
#   RATE_LIMIT_AI_RPM=20      (requêtes IA /min/IP — 0 pour désactiver)

services:
  db:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  backend:
    ports: !reset []
    environment:
      FUSIONDEX_ENV: production          # désactive Swagger UI + ReDoc
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS requis dans .env.prod}
      RATE_LIMIT_AI_RPM: ${RATE_LIMIT_AI_RPM:-20}
      TRUSTED_PROXY: "1"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?INTERNAL_API_KEY requis — générer avec : openssl rand -hex 32}"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

  sprites:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  frontend:
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?INTERNAL_API_KEY requis — générer avec : openssl rand -hex 32}"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

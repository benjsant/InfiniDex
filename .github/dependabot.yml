# Veille des dépendances - complète wiki-watch.yml (veille des données).
# Une PR groupée par écosystème et par semaine (lundi, comme la veille wiki),
# mineures et correctifs ensemble ; les majeures arrivent seules pour être
# revues à part. La CI de chaque couche valide la PR avant merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /etl
    schedule: { interval: weekly, day: monday, time: "06:30", timezone: Europe/Paris }
    groups:
      etl-minor-patch: { update-types: [minor, patch] }
    labels: [dependencies, etl]

  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:30", timezone: Europe/Paris }
    groups:
      backend-minor-patch: { update-types: [minor, patch] }
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "06:30", timezone: Europe/Paris }
    groups:
      frontend-minor-patch: { update-types: [minor, patch] }
    labels: [dependencies, frontend]

  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly, day: monday, time: "06:30", timezone: Europe/Paris }
    groups:
      e2e-minor-patch: { update-types: [minor, patch] }
    labels: [dependencies, e2e]
    ignore:
      # Doit rester égal à l'image mcr.microsoft.com/playwright de
      # docker/Dockerfile.e2e (navigateurs embarqués) : c'est la PR docker
      # qui pilote, on bumpe package.json dans la même PR.
      - dependency-name: "@playwright/test"

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:30", timezone: Europe/Paris }
    groups:
      actions: { patterns: ["*"] }
    labels: [dependencies, ci]

  # Images de base des Dockerfiles (python, node, playwright)
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly, day: monday, time: "06:30", timezone: Europe/Paris }
    groups:
      docker-images: { update-types: [minor, patch] }
    labels: [dependencies, docker]
    ignore:
      # Une « mineure » Python (3.12 → 3.14) est une majeure en pratique
      # (wheels natives, compat des libs). Changement de runtime = décision
      # à la main, avec les lockfiles régénérés.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Node : rester sur une LTS paire, choisie à la main.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Images des services compose (postgres, nginx, prefect, ollama).
  # Exige des tags épinglés : un tag flottant comme `3-latest` n'est jamais bumpé.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:30", timezone: Europe/Paris }
    groups:
      compose-images: { update-types: [minor, patch] }
    labels: [dependencies, docker]
    ignore:
      # Le serveur Prefect suit le lock ETL (test etl/tests/test_versions.py) :
      # il est bumpé dans la PR uv de etl/, pas ici. Dependabot proposait en
      # plus des tags de pré-release (3.8.7.dev2).
      - dependency-name: prefecthq/prefect
      # Majeure Postgres = répertoire de données incompatible (dump/restore).
      # À planifier à la main, jamais en PR automatique.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Ollama publie sans semver stable ; tag latest assumé (profil optionnel).
      - dependency-name: ollama/ollama

name: Wiki watch

# Veille hebdomadaire des sources externes de l'ETL (wiki IF, Pokepédia,
# PokeAPI). Toutes les casses passées venaient d'une restructuration upstream
# découverte par accident - ce cron la détecte avant le prochain rebuild.
# Le job échoue si un invariant n'est plus respecté → notification GitHub.

on:
  schedule:
    - cron: "0 6 * * 1"   # tous les lundis 06:00 UTC
  workflow_dispatch:

jobs:
  probe:
    name: Probe external sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.12"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ETL deps
        run: uv sync --frozen --project etl

      - name: Probe sources (cache HTTP désactivé)
        env:
          ETL_HTTP_CACHE_TTL_HOURS: "0"
        run: uv run --project etl python -m etl.scripts.check_sources
